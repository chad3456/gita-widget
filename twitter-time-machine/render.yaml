# One-click deploy on Render (https://render.com) — "New → Blueprint" and point
# it at this repo. The service builds from this subdirectory.
services:
  - type: web
    name: tweet-time-machine
    runtime: node
    plan: free
    rootDir: twitter-time-machine
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/config
    envVars:
      - key: NODE_ENV
        value: production
      - key: X_BEARER_TOKEN
        sync: false # set this yourself in the dashboard to enable the official X API
